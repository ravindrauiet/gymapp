<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FITKEY Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">F</span> FITKEY <small>Admin</small></div>
    <nav id="tabs" hidden>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="venues">Venues</button>
      <button data-tab="plans">Plans</button>
      <button data-tab="videos">Studio videos</button>
      <button data-tab="events">Events</button>
      <button data-tab="orgs">Orgs</button>
      <button data-tab="ids">ID approvals <span class="badge" data-badge="ids" hidden></span></button>
      <button data-tab="corporate">Corporate</button>
      <button data-tab="fitfeed">FitFeed</button>
      <button data-tab="alerts">Rating alerts <span class="badge" data-badge="alerts" hidden></span></button>
      <button data-tab="reports">Reports</button>
    </nav>
    <button id="logout" class="ghost" hidden>Log out</button>
  </header>

  <main id="app">
    <section id="login" class="card narrow" hidden>
      <h2>Team sign-in</h2>
      <p class="muted">Use the admin phone number configured as <code>ADMIN_PHONE</code>.</p>
      <form id="login-phone">
        <label>Phone <input name="phone" placeholder="+91 99999 99999" required /></label>
        <button type="submit">Send OTP</button>
      </form>
      <form id="login-otp" hidden>
        <label>OTP <input name="otp" inputmode="numeric" maxlength="6" required /></label>
        <p id="dev-otp" class="muted"></p>
        <button type="submit">Verify</button>
      </form>
    </section>

    <section id="view"></section>
  </main>

  <div id="toast" hidden></div>
  <script src="admin.js" type="module"></script>
</body>
</html>
