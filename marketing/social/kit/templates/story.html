<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FITKEY · story</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* STORY (1080x1920), used for every story whatever its type.
     - top 250 / bottom 250 px: Instagram UI zones, decoration only (no copy, no logo).
     - copy block (header, eyebrow, headline, body, launch pill / store button) from y=260 down.
     - the visual fills everything below the copy and bleeds off the bottom edge:
         screen:x -> big tilted phone over accent shapes;  photo:x -> full-bleed photo (scan frame on scan stories)
     - slide.sticker set -> a sticker zone above the bottom safe area: calmer backdrop + a small "tap below" hint.
       no sticker -> no zone, the visual simply runs to the edge. */
  .st .copy { position: absolute; z-index: 10; left: var(--mx); right: var(--mx); top: var(--pt); }
  .st .copy .hdr { margin-bottom: 52px; }
  .st .copy .stack { gap: 38px; }
  .st .h { line-height: .95; letter-spacing: -.05em; }
  .st .body { max-width: 860px; }
  .st .storebtn { align-self: flex-start; }
  .t-dark.st .storebtn { background: var(--lime); color: var(--ink); box-shadow: 0 22px 50px rgba(200,243,29,.22); }
  .t-dark.st .storebtn .sb-ic { background: var(--ink); color: var(--lime); }
  .st .box { max-height: 900px; }

  /* screen visual */
  .st .vis { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; }
  .st .vis .phone { position: absolute; left: 50%; top: 0; transform: translateX(-44%) rotate(-5deg); transform-origin: 50% 0;
    box-shadow: 0 0 0 2px rgba(255,255,255,.08) inset, -40px 60px 120px rgba(0,0,0,.45); z-index: 3; }
  .st .shape { position: absolute; z-index: 1; border-radius: 120px; background: var(--shape, var(--glow)); }
  .st .shape.a { width: 760px; height: 1000px; left: 50%; top: 120px; transform: translateX(-60%) rotate(12deg); opacity: .95; }
  .st .shape.b { width: 300px; height: 300px; right: -90px; top: -40px; border-radius: 50%; background: transparent; border: 34px solid var(--shape2, var(--lime)); opacity: .9; }
  .st .rings { position: absolute; z-index: 0; left: 50%; top: 360px; width: 1700px; height: 1700px; transform: translate(-50%, -50%); pointer-events: none;
    background: repeating-radial-gradient(circle, var(--s-faint) 0 2px, transparent 2px 130px);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 62%); mask: radial-gradient(circle, #000 25%, transparent 62%); }

  /* photo visual */
  .st .photo { z-index: 0; }
  .st .photo img { filter: saturate(1.1) contrast(1.06) brightness(.92); }
  .st .pscrim { position: absolute; inset: 0; z-index: 1; }
  .st .scan { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); width: 720px; height: 560px; }
  .st .scan i { position: absolute; width: 110px; height: 110px; border: 12px solid var(--lime); }
  .st .scan i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 44px 0 0 0; }
  .st .scan i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 44px 0 0; }
  .st .scan i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 44px; }
  .st .scan i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 44px 0; }
  .st .scan b { position: absolute; left: 30px; right: 30px; top: 46%; height: 6px; border-radius: 9px; background: var(--lime); box-shadow: 0 0 30px 6px rgba(200,243,29,.55); }

  /* sticker zone: calmer backdrop + hint */
  .st .zonefx { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: 900px; pointer-events: none;
    background: linear-gradient(180deg, rgba(17,18,24,0) 0%, rgba(17,18,24,.42) 45%, rgba(17,18,24,.72) 100%); }
  .st .hint { position: absolute; z-index: 12; left: 50%; transform: translateX(-50%); top: 1236px;
    display: inline-flex; align-items: center; gap: 14px; height: 60px; padding: 0 30px 0 16px; border-radius: 99px;
    background: rgba(17,18,24,.72); color: #fff; border: 2px solid rgba(255,255,255,.22); backdrop-filter: blur(10px);
    font-weight: 800; font-size: 25px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .st .hint i { width: 36px; height: 36px; border-radius: 99px; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
  .st .hint i svg { width: 22px; height: 22px; transform: rotate(90deg); stroke-width: 3; }
</style></head>
<body>
<script src="../kit.js"></script>
<script>
Kit.mount((s, c) => {
  const v = Kit.parseVisual(s.visual);
  const a = Kit.normAccent(s.accent);
  const isPhoto = v.kind === 'photo';
  const theme = Kit.THEMES.includes(s.theme) ? s.theme : isPhoto ? 'dark'
    : ({ lime: 'dark', purple: 'mansi', mansi: 'mansi', pink: 'mansi', ember: 'ember', blue: 'dark', green: 'dark' }[a] || 'dark');
  const accent = Kit.accentColor(a);
  // background shapes: accent block behind the phone, lime ring as a counterpoint
  const shape = theme === 'mansi' ? 'rgba(255,255,255,.16)' : theme === 'ember' ? 'rgba(26,27,37,.9)' : a === 'lime' ? '#FF5A36' : accent;
  const shape2 = theme === 'ember' ? '#C8F31D' : theme === 'mansi' ? '#C8F31D' : a === 'lime' ? '#C8F31D' : '#C8F31D';
  const isCta = String(s.type).toLowerCase() === 'cta';
  const sticker = String(s.sticker || '');
  const hintText = /poll/i.test(sticker) ? 'Vote below' : /question/i.test(sticker) ? 'Ask below'
    : /slider/i.test(sticker) ? 'Slide below' : /mention/i.test(sticker) ? 'Tag a buddy below' : 'Tap the link below';
  const scanStory = /scan/i.test(`${s.eyebrow} ${s.headline}`);

  let visual = '';
  if (isPhoto) {
    visual = `${Kit.photo(v, s.focus || v.focus || 'center')}<div class="pscrim"></div>
      ${scanStory ? '<div class="scan"><i></i><i></i><i></i><i></i><b></b></div>' : ''}
      ${v.inset && v.inset.kind === 'screen' ? `<div class="vis">${Kit.phone(v.inset, 560)}</div>` : ''}`;
  } else {
    visual = `<div class="rings"></div><div class="vis"><div class="shape a"></div><div class="shape b"></div>${Kit.phone(v.kind === 'screen' ? v : { kind: 'none', name: v.name }, 640)}</div>`;
  }

  Kit.afterFit(() => {
    const copy = document.querySelector('.st .copy');
    const bottom = copy.getBoundingClientRect().bottom;
    const vis = document.querySelector('.st .vis');
    if (vis) { vis.style.top = Math.round(bottom + (isPhoto ? 40 : 70)) + 'px'; }
    const ps = document.querySelector('.st .pscrim');
    const pimg = document.querySelector('.st .photo img');
    // landscape photos can't fill 9:16 without a meaningless crop: they fill the area below the copy instead
    // (portrait photos too: their subject would otherwise hide behind the headline)
    const land = !!pimg;
    if (land) document.querySelector('.st .photo').style.top = Math.round(bottom - 140) + 'px';
    if (ps) {
      const b = Math.round(bottom);
      ps.style.background = land
        ? `linear-gradient(180deg, #111218 0px, #111218 ${b - 140}px, rgba(17,18,24,.55) ${b - 20}px, rgba(17,18,24,0) ${b + 200}px)`
        : `linear-gradient(180deg, rgba(17,18,24,.9) 0px, rgba(17,18,24,.82) ${b - 120}px, rgba(17,18,24,0) ${b + 260}px)`;
    }
    const sc = document.querySelector('.st .scan');
    if (sc) { // scan frame from below the copy to just above the bottom safe zone (the sticker sits inside it)
      const top = Math.round(bottom + 80), h = Math.max(420, 1630 - top);
      sc.style.top = top + 'px'; sc.style.height = h + 'px'; sc.style.width = '880px';
    }
  });

  const H = 136, B = 40;
  return Kit.shell(s, c, { theme, cls: 'st', style: `--shape:${shape};--shape2:${shape2}`, inner: `
    ${visual}
    ${s.sticker ? `<div class="zonefx"></div><div class="hint"><i>${Kit.icon('arrow')}</i>${Kit.esc(hintText)}</div>` : ''}
    <div class="copy">
      ${Kit.hdr(c)}
      <div class="box" data-box="story"><div class="stack">
        ${Kit.eyebrow(s)}
        <h1 class="h" data-fit="${H},76">${Kit.headline(s)}</h1>
        ${s.body ? `<p class="body" data-fit="${B},28" data-order="1">${Kit.rich(s.body)}</p>` : ''}
        ${isCta ? Kit.storeBtn() : Kit.launchPill()}
      </div></div>
    </div>` });
}, {
  slide: { type: 'feature', eyebrow: 'PROVEIT', headline: 'How many real pushups?', body: 'Phone camera counts. Half reps don’t. Find your All India Rank.', visual: 'screen:proveit_exercise', accent: 'lime', sticker: 'poll' },
  ctx: { kind: 'story', index: 0, total: 1, format: 'story' },
});
</script>
</body></html>
