<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FITKEY · cover</title>
<link rel="stylesheet" href="../kit.css">
<style>
  /* COVER — huge headline over a full-bleed photo with gradient scrim */
  .cover .scrim { position: absolute; inset: 0; z-index: 2; background:
    linear-gradient(180deg, rgba(17,18,24,.66) 0%, rgba(17,18,24,.12) 20%, rgba(17,18,24,.12) 32%, rgba(17,18,24,.78) 56%, rgba(17,18,24,.97) 80%, #111218 100%),
    radial-gradient(900px 600px at 0% 100%, color-mix(in srgb, var(--glow) 38%, transparent), transparent 70%); }
  .cover .photo img { filter: saturate(1.1) contrast(1.1) brightness(.82); }
  .cover .eyebrow { background: rgba(17,18,24,.55); backdrop-filter: blur(12px); border-color: rgba(255,255,255,.18); }
  .cover .main { display: flex; flex-direction: column; justify-content: flex-end; }
  .cover .stack { gap: 34px; }
  .cover .h { line-height: .9; letter-spacing: -.05em; }
  .cover .body { color: rgba(255,255,255,.84); max-width: 820px; }
  .fmt-story .cover .stack { gap: 44px; }

  .sticker { position: absolute; z-index: 12; width: 212px; height: 212px; border-radius: 50%; background: var(--lime); color: var(--ink);
    display: grid; place-items: center; text-align: center; transform: rotate(11deg);
    right: var(--mx); top: calc(var(--pt) + 124px); box-shadow: 0 20px 44px rgba(0,0,0,.35); }
  .sticker span { font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.02em; width: 160px; text-wrap: balance; }
  .sticker::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2.5px dashed rgba(26,27,37,.35); }
  .fmt-square .sticker { width: 180px; height: 180px; top: calc(var(--pt) + 96px); }
  .fmt-square .sticker span { font-size: 26px; width: 136px; }

  /* screen-led cover (no photo): floating phone top-right */
  .cover .float { position: absolute; z-index: 3; right: 30px; top: 110px; padding: 40px; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .cover .float .phone { transform: rotate(8deg); }
  .cover .float-glow { position: absolute; z-index: 0; width: 760px; height: 760px; right: -160px; top: 40px; border-radius: 50%; background: var(--glow); filter: blur(120px); opacity: .45; }
  .cover .icon-mega { position: absolute; z-index: 1; right: -80px; top: 60px; width: 760px; height: 760px; color: var(--lime); opacity: .14; }
</style></head>
<body>
<script src="../kit.js"></script>
<script>
Kit.mount((s, c) => {
  const v = Kit.parseVisual(s.visual);
  const H = { post: 152, square: 124, story: 168 }[c.format];
  const B = { post: 34, square: 30, story: 40 }[c.format];
  let art = '';
  if (v.kind === 'photo') art = Kit.photo(v, s.focus || 'center');
  else if (v.kind === 'screen') art = `<div class="float-glow"></div><div class="float">${Kit.phone(v, c.format === 'story' ? 520 : 400)}</div>`;
  else art = `<div class="icon-mega">${Kit.icon(v.name || 'key')}</div>`;
  // launch badge: the plan's own badge wins; single feed covers get the LAUNCH_STATE badge by default
  const badge = s.badge || (c.kind === 'post' ? Kit.LAUNCH.badge : '');
  if (v.kind === 'screen') Kit.afterFit(() => {
    // the phone fades out above the headline: app text never sits behind the headline
    const fl = document.querySelector('.float'), top = document.querySelector('.cover .stack').getBoundingClientRect().top;
    const r = fl.getBoundingClientRect(), end = Math.max(0, top - 30 - r.top), start = Math.max(0, end - 200);
    fl.style.webkitMaskImage = fl.style.maskImage = `linear-gradient(180deg, #000 ${start}px, transparent ${end}px)`;
  });
  const isFirst = c.kind === 'carousel' && c.index === 0 && c.total > 1;
  return Kit.shell(s, c, { theme: 'dark', cls: 'cover', inner: `
    ${art}
    <div class="scrim"></div>
    ${badge ? `<div class="sticker"><span>${Kit.esc(badge)}</span></div>` : ''}
    <div class="frame">
      ${Kit.hdr(c)}
      <div class="main box" data-box="cover"><div class="stack">
        ${Kit.eyebrow(s)}
        <h1 class="h" data-fit="${H},64">${Kit.headline(s)}</h1>
        ${s.body ? `<p class="body" data-fit="${B},26" data-order="1">${Kit.rich(s.body)}</p>` : ''}
      </div></div>
      ${Kit.ftr(c, { right: isFirst ? Kit.swipe(s.swipe || 'Swipe') : undefined })}
    </div>` });
}, {
  slide: { type: 'cover', eyebrow: 'Now live in India', headline: 'One key.\n*Every* gym.', body: 'Gyms, pools, yoga, MMA and more — one pass, zero lock-ins.', visual: "photo:strength", badge: 'No lock-in. Ever.' },
  ctx: { kind: 'carousel', index: 0, total: 6, format: 'post' },
});
</script>
</body></html>
